<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR with model-viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer@3.3.0/dist/model-viewer.min.js"></script>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0c1c2c; color: #f6f8fb; display: grid; place-items: center; min-height: 100vh; padding: 24px; }
    main { width: min(960px, 100%); display: grid; gap: 12px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 20px; letter-spacing: 0.3px; }
    a { color: #8fd0ff; }
    model-viewer { width: 100%; height: 70vh; border-radius: 14px; overflow: hidden; background: radial-gradient(circle at 20% 20%, #12304a, #07121f 60%); }
    #ar-btn { pointer-events: auto; padding: 12px 16px; border: none; border-radius: 12px; background: #0b6bff; color: #fff; font-size: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); cursor: pointer; }
    #tip { font-size: 14px; color: #c9d7e3; }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>model-viewer ARデモ</h1>
      <div id="tip">GLB を差し替えてそのまま使えます。iOS は <code>models/model.usdz</code> を置くと Quick Look にフォールバックして安定します。</div>
    </div>
    <a href="viewer.html">360°ビューを開く</a>
  </header>

  <model-viewer id="ar-model"
    src="models/model.glb"
    ios-src="models/model.usdz"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1.1"
    environment-image="neutral"
    disable-zoom>
    <button slot="ar-button" id="ar-btn">ARで表示</button>
  </model-viewer>
</main>
</body>
</html>
