<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360° model viewer</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer@3.3.0/dist/model-viewer.min.js"></script>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0c1c2c; color: #f6f8fb; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(960px, 100%); display: grid; gap: 12px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 20px; letter-spacing: 0.3px; }
    a { color: #8fd0ff; }
    model-viewer { width: 100%; height: 75vh; border-radius: 14px; overflow: hidden; background: radial-gradient(circle at 20% 20%, #12304a, #07121f 60%); }
    #tip { font-size: 14px; color: #c9d7e3; }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>360°ビュー</h1>
      <div id="tip">ドラッグ/ピンチで回転・ズーム。モデルは <code>models/model.glb</code> を参照しています。</div>
    </div>
    <a href="index.html">ARに戻る</a>
  </header>

  <model-viewer
    src="models/model.glb"
    ios-src="models/model.usdz"
    camera-controls
    auto-rotate
    auto-rotate-delay="2000"
    shadow-intensity="1"
    exposure="1.1"
    environment-image="neutral">
  </model-viewer>
</main>
</body>
</html>
